<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slideshow</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
    <div id="slideWrapper">
        <div class="slide">
            <img src="images (1).jpg" style="width:100%"/>
    </div>

    <div class="slide">
        <img src="images (1).png" style="width: 100%;">
    </div>

    <div class="slide">
        <img src="images (2).jpg" style="width: 100%;">
    </div>
    </div>

    <a class="prev"><img src="images (1).png" style="width: 50px;height: 50px;" onclick="plusSLIDES(-1)"></a>
    <a class="next"><img src="images.png" style="width: 50px;height: 50px;" onclick="plusSLIDES(1)"></a>

    <script type="text/javascript" src="js/main.js"></script>








    
</body>
</html>
